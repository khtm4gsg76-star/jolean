services:
  - type: web
    name: mazagi-host
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 60
    disk:
      name: mazagi-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: MAZAGI_DATA_DIR
        value: /data
      - key: COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: PUBLIC_SITE_DOMAIN
        sync: false
      - key: PUBLIC_SITE_SCHEME
        value: https
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
